name: 同步维护状态到数据中心

on:
  workflow_dispatch:
  push:
    paths:
      - src/automas_api/publish.py
      - src/automas_api/state.py
      - .github/workflows/sync.yml

permissions:
  contents: read

# Share the publisher lock with update.yml, so an older manual retry cannot
# overwrite a more recent opening event. Checkout happens after acquiring it.
concurrency:
  group: maintenance-policy-publisher
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked --no-dev
      - name: Load latest generated policy from data branch
        run: uv run --no-dev python -m automas_api.state load --require-existing
      - name: Synchronize and verify public download
        env:
          AUTOMAS_TOKEN: ${{ secrets.AUTOMAS_TOKEN }}
          AUTOMAS_FILE_ID: ${{ vars.AUTOMAS_FILE_ID }}
          AUTOMAS_PUBLIC_URL: ${{ vars.AUTOMAS_PUBLIC_URL }}
        run: uv run --no-dev automas-publish --change-note "GitHub Actions sync $GITHUB_RUN_ID"
