name: 更新维护状态 / 标记已开服

on:
  schedule:
    # Daily at 05:07 Asia/Shanghai (21:07 UTC on the previous day).
    - cron: '7 21 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 选择要标记为已开服的游戏
        required: true
        type: choice
        default: arknights
        options:
          - arknights
          - endfield
  push:
    paths:
      - config/overrides.json
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/update.yml

permissions:
  contents: read

concurrency:
  group: maintenance-policy-publisher
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write # Generated state is written only to refs/heads/data.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked
      - name: Check before publishing
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - name: Load persistent state from data branch
        run: uv run python -m automas_api.state load
      - name: Poll and merge overrides
        env:
          MARK_OPENED_GAME: ${{ github.event_name == 'workflow_dispatch' && inputs.game || '' }}
        run: |
          if [ -n "$MARK_OPENED_GAME" ]; then
            uv run automas-update --allow-source-failures --mark-opened "$MARK_OPENED_GAME"
          else
            uv run automas-update --allow-source-failures
          fi
      - name: Save policy and opening event to data branch
        run: uv run python -m automas_api.state save
      - name: Synchronize data.auto-mas.top
        env:
          AUTOMAS_TOKEN: ${{ secrets.AUTOMAS_TOKEN }}
          AUTOMAS_FILE_ID: ${{ vars.AUTOMAS_FILE_ID }}
          AUTOMAS_PUBLIC_URL: ${{ vars.AUTOMAS_PUBLIC_URL }}
        run: uv run automas-publish --change-note "GitHub Actions run $GITHUB_RUN_ID"
      - name: Report source failures after publishing fail-open state
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('poll-report.json')
          if not report_path.exists():
              raise SystemExit(1)
          report = json.loads(report_path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + json.dumps(report, ensure_ascii=False, indent=2) + '\n```\n')
          raise SystemExit(bool(report['errors']))
          PY
