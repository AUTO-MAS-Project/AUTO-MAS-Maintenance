name: 更新维护状态 / 标记已开服

on:
  schedule:
    # Daily at 05:07 Asia/Shanghai (21:07 UTC on the previous day).
    - cron: '7 21 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 选择要标记为已开服的游戏
        required: true
        type: choice
        default: arknights
        options:
          - arknights
          - endfield
  push:
    paths:
      - config/overrides.json
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: maintenance-policy-publisher
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked
      - name: Check before publishing
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Poll and merge overrides
        env:
          MARK_OPENED_GAME: ${{ github.event_name == 'workflow_dispatch' && inputs.game || '' }}
        run: |
          if [ -n "$MARK_OPENED_GAME" ]; then
            uv run automas-update --allow-source-failures --mark-opened "$MARK_OPENED_GAME"
          else
            uv run automas-update --allow-source-failures
          fi
      - name: Commit policy and opening event
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- api/v1/status.json config/overrides.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh maintenance policy'
          # A concurrent manual edit causes a non-fast-forward rejection.
          # Never rebase this stale result onto newer override configuration.
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Report source failures after publishing fail-open state
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('poll-report.json')
          if not report_path.exists():
              raise SystemExit(1)
          report = json.loads(report_path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + json.dumps(report, ensure_ascii=False, indent=2) + '\n```\n')
          raise SystemExit(bool(report['errors']))
          PY
