name: Check

on:
  pull_request:
  push:
    paths-ignore:
      - api/v1/status.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Validate policy and override documents
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from automas_api.models import validate_status
          from automas_api.overrides import parse_overrides

          validate_status(json.loads(Path('api/v1/status.json').read_text()))
          parse_overrides(json.loads(Path('config/overrides.json').read_text()))
          PY
