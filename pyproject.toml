[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automas-api"
version = "0.1.0"
description = "Official maintenance announcements as a small, static AUTO-MAS policy API"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
automas-update = "automas_api.update:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.23", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

